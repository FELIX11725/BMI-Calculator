<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form class="calculator">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" name="weight" placeholder="Enter your weight" required>
            
            <label for="height">Height (cm)</label>
            <input type="number" id="height" name="height" placeholder="Enter your height" required>
            
            <button type="submit">Calculate BMI</button>
        </form>
        <div id="resultArea" style="margin-top: 20px; font-size: 18px; text-align: center;"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.querySelector('.calculator');
            const weightInput = document.getElementById('weight');
            const heightInput = document.getElementById('height');
            const resultArea = document.getElementById('resultArea');

            form.addEventListener('submit', function (event) {
                event.preventDefault(); // Prevent actual form submission

                const weight = parseFloat(weightInput.value);
                const height = parseFloat(heightInput.value);

                resultArea.innerHTML = ''; // Clear previous results or errors
                // Default error color, will be overridden on successful calculation or specific errors
                resultArea.style.color = '#dc3545'; // Bootstrap's danger red

                if (isNaN(weight) || isNaN(height)) {
                    resultArea.textContent = 'Please enter valid numbers for weight and height.';
                    return;
                }

                if (weight <= 0 || height <= 0) {
                    resultArea.textContent = 'Weight and height must be positive numbers.';
                    return;
                }

                // BMI Calculation: weight (kg) / (height (m))^2
                const heightInMeters = height / 100;
                const bmi = weight / (heightInMeters * heightInMeters);
                const bmiRounded = parseFloat(bmi.toFixed(2)); // Keep as number for comparison

                let category = '';
                let categoryColor = '#007bff'; // Default to primary blue if something goes wrong

                if (bmiRounded < 18.5) {
                    category = 'Underweight';
                    categoryColor = '#17a2b8'; // Info blue
                } else if (bmiRounded >= 18.5 && bmiRounded <= 24.9) {
                    category = 'Normal weight';
                    categoryColor = '#28a745'; // Success green
                } else if (bmiRounded >= 25 && bmiRounded <= 29.9) {
                    category = 'Overweight';
                    categoryColor = '#ffc107'; // Warning yellow/orange
                } else if (bmiRounded >= 30) {
                    category = 'Obese';
                    categoryColor = '#dc3545'; // Danger red
                }

                resultArea.style.color = categoryColor;
                resultArea.innerHTML = `Your BMI is: <strong>${bmiRounded.toFixed(2)}</strong> (${category})`;
            });
        });
    </script>

</body>
</html>
